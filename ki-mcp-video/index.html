<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Planen mit KI + MCP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#111;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #stage{width:1920px;height:1080px;display:block;}
  body.preview #stage{width:min(100vw,177.78vh);height:auto;}
  svg text{font-family:Inter,"Inter Display",system-ui,sans-serif;font-feature-settings:"tnum" 1;}
  #ui{position:fixed;left:12px;bottom:10px;color:#ccc;font:13px Inter,sans-serif;}
  body.capture #ui{display:none;}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="ui">Leertaste: Play/Pause · ←/→: ±1 s · <span id="tc"></span></div>
<script>
/* =========================================================================
   Motion-Erklärvideo: „Planen wie bisher vs. Planen mit KI + MCP“
   1920×1080 · 30 fps · 20 s · deterministisch über renderFrame(t)
   ========================================================================= */
const DUR = 20, FPS = 30;

const C = {
  // links – gedämpft grau/rot
  lBg:'#EFEAE8', lBg2:'#E4DDDA', lInk:'#4A4240', lMut:'#8E8481', lRed:'#B5564C', lRed2:'#CB8B81',
  lLine:'#CDC3BF', lWall1:'#D8D0CD', lWall2:'#C4BAB6', lWall3:'#ADA29E',
  // rechts – frisch blau/grün
  rBg:'#E8F4F8', rBg2:'#D6EBF3', rInk:'#0F3048', rMut:'#5D7F94', rBlue:'#1F7FE0', rBlue2:'#63ADF5',
  rGreen:'#16B07A', rGreen2:'#7FDDB7', rTeal:'#11A3A6', rLine:'#BCD8E6',
  skin:'#E7C1A2', white:'#FFFFFF', navy:'#0C1E30'
};

/* ---------- Helfer ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const eback=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const E=(t,a,b,f=eio)=>f(P(t,a,b));
const f1=n=>(+n).toFixed(1);
function hex2rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function T(x,y,s,o={}){
  const a=o.anchor||'start', w=o.weight||600, sz=o.size||24, fill=o.fill||'#000';
  const ls=o.ls!=null?`letter-spacing="${o.ls}"`:'';
  const op=o.op!=null?`opacity="${f1(o.op*100)/100}"`:'';
  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${sz}" font-weight="${w}" fill="${fill}" text-anchor="${a}" ${ls} ${op}>${esc(s)}</text>`;
}
function G(c,o={}){
  let tr='';
  if(o.x!=null||o.y!=null) tr+=`translate(${f1(o.x||0)} ${f1(o.y||0)}) `;
  if(o.s!=null&&o.s!==1){const cx=o.cx||0,cy=o.cy||0;tr+=`translate(${f1(cx)} ${f1(cy)}) scale(${o.s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)}) `;}
  if(o.r){tr+=`rotate(${f1(o.r)} ${f1(o.rx||0)} ${f1(o.ry||0)}) `;}
  const op=o.op!=null?` opacity="${o.op.toFixed(3)}"`:'';
  const cl=o.clip?` clip-path="url(#${o.clip})"`:'';
  const fl=o.filter?` filter="url(#${o.filter})"`:'';
  return `<g${tr?` transform="${tr}"`:''}${op}${cl}${fl}>${c}</g>`;
}
const R=(x,y,w,h,f,o={})=>`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0,w))}" height="${f1(Math.max(0,h))}" rx="${o.rx||0}" fill="${f}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.sw||2}"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op.toFixed(3)}"`:''}${o.filter?` filter="url(#${o.filter})"`:''}/>`;
const Ci=(x,y,r,f,o={})=>`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(Math.max(0,r))}" fill="${f}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.sw||2}"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op.toFixed(3)}"`:''}/>`;
const L=(x1,y1,x2,y2,s,w=2,o={})=>`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${s}" stroke-width="${w}" stroke-linecap="${o.cap||'round'}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op.toFixed(3)}"`:''}/>`;
const Pth=(d,f,o={})=>`<path d="${d}" fill="${f}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.sw||2}" stroke-linecap="round" stroke-linejoin="round"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op.toFixed(3)}"`:''}/>`;
const poly=(pts,f,o={})=>`<polygon points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="${f}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.sw||1.5}" stroke-linejoin="round"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op.toFixed(3)}"`:''}/>`;

/* ---------- Icons (eigene, keine Logos) ---------- */
function icoCheck(x,y,r,col,k=1){ // gefüllter Kreis mit Haken, k=Fortschritt
  const s=r/20;
  const d=`M${x-8*s},${y+0.5*s} L${x-2.5*s},${y+6*s} L${x+9*s},${y-6.5*s}`;
  return Ci(x,y,r*eback(clamp(k*1.6)),col)+(k>0.35?`<path d="${d}" fill="none" stroke="#fff" stroke-width="${3.6*s}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="${f1(40*(1-E(k,.35,1)))}"/>`:'');
}
function icoClock(x,y,r,col,ang,bg='#fff'){
  return Ci(x,y,r,bg,{stroke:col,sw:4})+L(x,y,x+Math.sin(ang)*r*0.62,y-Math.cos(ang)*r*0.62,col,4)+L(x,y,x+Math.sin(ang/12)*r*0.42,y-Math.cos(ang/12)*r*0.42,col,4)+Ci(x,y,3,col);
}
function icoPrompt(x,y,s,col){ // Sprechblase mit Zeilen
  return G(Pth('M-26,-20 h52 a8,8 0 0 1 8,8 v26 a8,8 0 0 1 -8,8 h-30 l-12,11 v-11 h-10 a8,8 0 0 1 -8,-8 v-26 a8,8 0 0 1 8,-8z',col)+L(-16,-6,16,-6,'#fff',4)+L(-16,5,6,5,'#fff',4),{x,y,s,cx:0,cy:0}).replace('<g transform="translate','<g transform="translate');
}
function sparkle(x,y,r,col){
  const k=r*0.28;
  return Pth(`M${x},${y-r} C${x+k*.4},${y-k} ${x+k},${y-k*.4} ${x+r},${y} C${x+k},${y+k*.4} ${x+k*.4},${y+k} ${x},${y+r} C${x-k*.4},${y+k} ${x-k},${y+k*.4} ${x-r},${y} C${x-k},${y-k*.4} ${x-k*.4},${y-k} ${x},${y-r}Z`,col);
}
function icoAI(x,y,s,col){return sparkle(x-4*s,y+3*s,20*s,col)+sparkle(x+16*s,y-15*s,9*s,col);}
function icoServer(x,y,s,col){
  let o='';
  for(let i=0;i<3;i++){const yy=y-24*s+i*17*s;o+=R(x-24*s,yy,48*s,13*s,col,{rx:4*s})+Ci(x-15*s,yy+6.5*s,2.6*s,'#fff')+L(x-4*s,yy+6.5*s,x+16*s,yy+6.5*s,'#fff',2.4*s);}
  return o;
}
function icoBIM(x,y,s,col){ // generischer iso-Würfel (kein Logo)
  const a=22*s,h=0.58*a;
  const top=[[x,y-a],[x+a*0.87,y-a+h],[x,y-a+2*h],[x-a*0.87,y-a+h]];
  const lf=[[x-a*0.87,y-a+h],[x,y-a+2*h],[x,y+a*0.9],[x-a*0.87,y+a*0.9-h]];
  const rf=[[x,y-a+2*h],[x+a*0.87,y-a+h],[x+a*0.87,y+a*0.9-h],[x,y+a*0.9]];
  return poly(top,'#fff',{op:.95})+poly(lf,'#fff',{op:.75})+poly(rf,'#fff',{op:.55});
}
function icoMouse(x,y,s,col){return R(x-11*s,y-16*s,22*s,32*s,'none',{rx:11*s,stroke:col,sw:3.2*s})+L(x,y-10*s,x,y-4*s,col,3.2*s);}
function icoBook(x,y,s,col){return Pth(`M${x-22*s},${y-14*s} q${11*s},${-6*s} ${22*s},0 q${11*s},${-6*s} ${22*s},0 v${28*s} q${-11*s},${-6*s} ${-22*s},0 q${-11*s},${-6*s} ${-22*s},0z`,'none',{stroke:col,sw:3*s})+L(x,y-14*s,x,y+14*s,col,3*s);}

/* ---------- Isometrie ---------- */
function isoP(o,x,y,z){return[o.x+(x-y)*0.866*o.s, o.y+(x+y)*0.5*o.s-z*o.s];}
function isoBox(o,x0,y0,z0,x1,y1,z1,c,extra={}){
  const Q=(x,y,z)=>isoP(o,x,y,z);
  let s='';
  s+=poly([Q(x0,y1,z0),Q(x1,y1,z0),Q(x1,y1,z1),Q(x0,y1,z1)],c.l,extra);
  s+=poly([Q(x1,y1,z0),Q(x1,y0,z0),Q(x1,y0,z1),Q(x1,y1,z1)],c.r,extra);
  s+=poly([Q(x0,y0,z1),Q(x1,y0,z1),Q(x1,y1,z1),Q(x0,y1,z1)],c.t,extra);
  return s;
}
function shrink(pts,k){const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length,cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;return pts.map(p=>[lerp(cx,p[0],k),lerp(cy,p[1],k)]);}

const BW=9, BD=6, FH=2.9; // Gebäudemaße (Einheiten)
/* Gebäude: prog = {floors:[h0,h1,h2] (0..1), win:[w0,w1,w2], roof, tower, ghost} */
function building(o,pr,pal){
  const Q=(x,y,z)=>isoP(o,x,y,z);
  let s='';
  // Grundstücksplatte
  const pl=[Q(-1.6,-1.6,0),Q(BW+3.2,-1.6,0),Q(BW+3.2,BD+1.8,0),Q(-1.6,BD+1.8,0)];
  s+=poly(pl,pal.plate,{op:pr.plate});
  // Raster
  let gr='';
  for(let i=0;i<=6;i++){const x=lerp(-1.6,BW+3.2,i/6);gr+=L(...Q(x,-1.6,0),...Q(x,BD+1.8,0),pal.grid,1.4);}
  for(let j=0;j<=4;j++){const y=lerp(-1.6,BD+1.8,j/4);gr+=L(...Q(-1.6,y,0),...Q(BW+3.2,y,0),pal.grid,1.4);}
  s+=G(gr,{op:pr.plate*0.9});
  // Geister-Volumen (Zielzustand)
  if(pr.ghost>0){
    const top=3*FH+0.45;
    const pts=[Q(0,0,top),Q(BW,0,top),Q(BW,0,0),Q(BW,BD,0),Q(0,BD,0),Q(0,BD,top)];
    s+=poly(pts,'none',{stroke:pal.ghost,sw:2,dash:'7 7',op:pr.ghost});
    s+=L(...Q(BW,BD,0),...Q(BW,BD,top),pal.ghost,2,{dash:'7 7',op:pr.ghost});
    s+=L(...Q(0,BD,top),...Q(BW,BD,top),pal.ghost,2,{dash:'7 7',op:pr.ghost});
    s+=L(...Q(BW,0,top),...Q(BW,BD,top),pal.ghost,2,{dash:'7 7',op:pr.ghost});
  }
  // Schatten
  const sh=Math.max(...pr.floors.map((h,i)=>h>0?1:0));
  if(sh) s+=poly([Q(0.2,BD,0),Q(BW+0.2,BD,0),Q(BW+1.8,BD+1.2,0),Q(1.8,BD+1.2,0)],pal.shadow,{op:.5*pr.plate});
  // Geschosse
  for(let i=0;i<3;i++){
    const h=pr.floors[i]; if(h<=0) continue;
    const z0=i*FH, z1=z0+FH*h;
    s+=isoBox(o,0,0,z0,BW,BD,z1,pal.wall);
    // Deckenkante
    if(h>=1) s+=L(...Q(0,BD,z1),...Q(BW,BD,z1),pal.edge,2)+L(...Q(BW,BD,z1),...Q(BW,0,z1),pal.edge,2);
    const w=pr.win[i]||0;
    if(w>0 && h>=1){
      // Fenster Front-links (y=BD)
      for(let k=0;k<4;k++){
        const kk=clamp(w*4-k*0.6); if(kk<=0) continue;
        const x1=0.75+k*2.15, x2=x1+1.35;
        const door=(i===0&&k===1);
        const za=z0+(door?0:0.85), zb=z0+(door?2.25:2.25);
        const pts=[Q(x1,BD,za),Q(x2,BD,za),Q(x2,BD,zb),Q(x1,BD,zb)];
        s+=poly(shrink(pts,eback(kk)),door?pal.door:pal.win);
        if(!door) s+=poly(shrink([Q(x1,BD,za),Q(x2,BD,za),Q(x2,BD,za+0.18),Q(x1,BD,za+0.18)],eback(kk)),pal.sill);
      }
      // Fenster rechts (x=BW)
      for(let k=0;k<3;k++){
        const kk=clamp(w*4-0.4-k*0.6); if(kk<=0) continue;
        const y1=BD-0.75-k*1.85, y2=y1-1.1;
        const pts=[Q(BW,y1,z0+0.85),Q(BW,y2,z0+0.85),Q(BW,y2,z0+2.25),Q(BW,y1,z0+2.25)];
        s+=poly(shrink(pts,eback(kk)),pal.win2);
      }
    }
  }
  // Dach
  if(pr.roof>0){
    const zt=3*FH, k=pr.roof;
    const lift=(1-eo(k))*3;
    s+=G(isoBox(o,-0.35,-0.35,zt+lift,BW+0.35,BD+0.35,zt+0.45+lift,pal.roof)+
         isoBox(o,1.2,1.0,zt+0.45+lift,3.4,2.6,zt+1.35+lift,pal.wall),{op:clamp(k*2)});
  }
  // Fluchttreppenhaus
  if(pr.tower>0){
    const ht=(3*FH+0.9)*eo(pr.tower);
    s+=isoBox(o,BW,1.9,0,BW+1.9,3.9,ht,pal.tower);
    if(pr.tower>0.6){
      const a=E(pr.tower,.6,1);
      // Fluchtweg-Pfeil + Tür
      const d=[Q(BW+0.55,3.9,0),Q(BW+1.35,3.9,0),Q(BW+1.35,3.9,2.0),Q(BW+0.55,3.9,2.0)];
      s+=poly(d,'#fff',{op:a*0.95});
      for(let i=1;i<3;i++){s+=poly([Q(BW+0.4,3.9,i*FH+0.9),Q(BW+1.5,3.9,i*FH+0.9),Q(BW+1.5,3.9,i*FH+2.2),Q(BW+0.4,3.9,i*FH+2.2)],'#fff',{op:a*0.55});}
      const [ax,ay]=Q(BW+0.95,3.9,1.0);
      s+=G(Pth('M-9,0 h12 M0,-7 l7,7 l-7,7',"none",{stroke:pal.tower.l,sw:3.5}),{x:ax,y:ay,op:a});
    }
  }
  return s;
}

/* ---------- Figuren ---------- */
function person(x,y,o){ // Seitenansicht, blickt nach rechts; (x,y) = Hüfte
  const lean=o.lean||0;
  let s='';
  // Stuhl
  s+=R(x-46,y+6,92,14,o.chair,{rx:7})+L(x-36,y+20,x-36,y+118,o.chair,8)+L(x+30,y+20,x+30,y+118,o.chair,8)+R(x-58,y-112,14,126,o.chair,{rx:7});
  // Beine
  s+=Pth(`M${x},${y} L${x+92},${y+4} L${x+96},${y+110}`,'none',{stroke:o.pants,sw:26});
  s+=R(x+84,y+104,44,14,o.shoe,{rx:7});
  // Oberkörper (dreht um Hüfte)
  let up='';
  up+=Pth(`M${x-6},${y+8} L${x-2},${y-112}`,'none',{stroke:o.shirt,sw:58});
  up+=Ci(x+8,y-170,36,C.skin);
  up+=Pth(`M${x-30},${y-168} q0,-44 40,-42 q36,2 34,30 q-22,-14 -44,-4 q-8,4 -12,22z`,o.hair);
  up+=Ci(x+28,y-168,3.4,'#3a2c26');
  // Arme: Schulter -> Ellbogen -> Hand
  const sx=x+2,sy=y-96;
  const hx=o.hand[0],hy=o.hand[1];
  const ex=o.elbow?o.elbow[0]:(sx+hx)/2-6, ey=o.elbow?o.elbow[1]:Math.max(sy,hy)+26;
  up+=Pth(`M${sx},${sy} L${ex},${ey} L${hx},${hy}`,'none',{stroke:o.shirt2,sw:20});
  up+=Ci(hx,hy,11,C.skin);
  s+=G(up,{r:lean,rx:x,ry:y});
  return s;
}

/* ---------- Szene: LINKS (Herkömmlich) ---------- */
const LO={x:0};
const planSegs=[[1,1,9,1],[9,1,9,6],[9,6,1,6],[1,6,1,1],[5,1,5,3.6],[1,3.6,3.6,3.6],[6.4,3.6,9,3.6],[3.2,3.6,3.2,6],[6.8,3.6,6.8,6],[7.4,1,7.4,2.3]];
const SEG0=3.7, SEGD=1.0;
function leftProgress(t){ // abgeschlossene Wandsegmente → Modellfortschritt
  let n=0;for(let i=0;i<planSegs.length;i++){const te=SEG0+i*SEGD+0.8;n+=E(t,te-0.05,te+0.15);}
  return n*0.035; // max 0.35
}
const LEFT_DAYS=t=>15*P(t,3.5,14);
function fmtLeft(t){
  const d=LEFT_DAYS(t);
  if(d<1) return Math.floor(d*24)+' Std';
  const n=Math.floor(d); return n+(n===1?' Tag':' Tage');
}
function sceneLeft(t){
  let s='';
  const pl=leftProgress(t);
  // Gebäude
  const f=pl*3.4;
  const o={x:650-(BW-BD)/2*0.866*23, y:403, s:23};
  s+=building(o,{plate:1,ghost:E(t,3.6,4.4)*0.9,floors:[clamp(f),clamp(f-1),clamp(f-2)],win:[clamp(f-1)>0?1:0,0,0],roof:0,tower:0},
    {plate:C.lBg2,grid:'#D6CDCA',ghost:C.lMut,shadow:'#CFC6C2',wall:{l:C.lWall2,r:C.lWall3,t:C.lWall1},edge:'#A3989400',win:'#9C918D',win2:'#8F8480',sill:'#E8E2E0',door:C.lRed2,roof:{l:'#7A706D',r:'#6A615E',t:'#8E8481'},tower:{l:'#999',r:'#888',t:'#aaa'}});
  // Baustellen-Kran-Hinweis: Fortschrittsbalken
  s+=progressBar(470,602,360,pl,C.lRed,C.lLine,C.lInk,'Modell');

  // Bücherstapel
  const books=[
    {w:262,h:40,c:'#8A6F69',lab:'Kommentare',dx:6},
    {w:246,h:34,c:C.lRed,lab:'DIN-Normen',dx:-8},
    {w:274,h:44,c:'#6F6562',lab:'Landesbauordnung',dx:2},
    {w:236,h:32,c:'#A9786F',lab:'Regelwerke',dx:-4},
    {w:252,h:36,c:'#857B78',lab:'Vorschriften',dx:8},
  ];
  let by=566;
  books.forEach((b,i)=>{
    const td=4.0+i*1.15;
    const k=P(t,td,td+0.5);
    if(k<=0){by-=b.h;return;}
    const yy=by-b.h - (1-eo(k))*260;
    const rot=(1-eo(k))*(i%2?8:-8);
    const bx=190-b.w/2+b.dx;
    let bk=R(bx,yy,b.w,b.h,b.c,{rx:4})+R(bx+b.w-14,yy+4,10,b.h-8,'#F4EEEC',{rx:2,op:.9});
    bk+=T(bx+26,yy+b.h/2+7,b.lab,{size:b.h>36?20:18,weight:700,fill:'#fff',ls:0.3});
    s+=G(bk,{op:clamp(k*3),r:rot,rx:bx+b.w/2,ry:yy+b.h/2});
    by-=b.h;
  });
  // aufgeschlagenes Buch obenauf + Blättern
  const ob=E(t,9.9,10.4);
  if(ob>0){
    const cx=190, cy=by-6;
    let bk='';
    bk+=Pth(`M${cx},${cy} L${cx-118},${cy-8} L${cx-118},${cy-62} Q${cx-60},${cy-74} ${cx},${cy-58}Z`,'#FBF8F7',{stroke:'#BDB2AE',sw:2});
    bk+=Pth(`M${cx},${cy} L${cx+118},${cy-8} L${cx+118},${cy-62} Q${cx+60},${cy-74} ${cx},${cy-58}Z`,'#FBF8F7',{stroke:'#BDB2AE',sw:2});

  // Zeitersparnis-Klammer
  const sv=E(t,16.0,16.7);
  if(sv>0){
    const x1=bx+24, x2=bx+bw;
    c+=R(x1,cy+202,(x2-x1)*sv,46,'#E3F7EE',{rx:10,stroke:C.rGreen,sw:2.5,dash:'8 6'});
    c+=G(T((x1+x2)/2,cy+235,'Zeitersparnis > 99 %',{size:32,weight:800,fill:'#0E9467',anchor:'middle'}),{op:E(t,16.4,16.9),s:lerp(0.9,1,E(t,16.4,16.9,eback)),cx:(x1+x2)/2,cy:cy+225});
  }
  c+=T(cx+cw-40,cy+ch-30,'Illustrative Beispielwerte',{size:17,weight:500,fill:'#9AA4AA',anchor:'end'});
  s+=G(c,{op:ci,y:(1-ci)*40});
  return s;
}

/* ---------- Abschluss ---------- */
function sceneOutro(t){
  const k=E(t,17.85,18.45);
  let s='';
  s+=`<rect x="0" y="0" width="1920" height="1080" fill="url(#outro)" opacity="${k.toFixed(3)}"/>`;
  const a=E(t,18.2,18.7), b=E(t,18.45,18.95), c=E(t,18.7,19.2);
  // Icon-Reihe
  const icons=[{x:780,ic:'ai',col:C.rGreen},{x:960,ic:'srv',col:C.rBlue},{x:1140,ic:'bim',col:C.rTeal}];
  let ir='';
  icons.forEach((n,i)=>{
    const kk=E(t,18.15+i*0.1,18.6+i*0.1,eback);
    let g=Ci(n.x,300,48,n.col);
    if(n.ic==='ai') g+=icoAI(n.x,300,1,'#fff');
    if(n.ic==='srv') g+=icoServer(n.x,303,0.9,'#fff');
    if(n.ic==='bim') g+=icoBIM(n.x,298,0.95,'#fff');
    ir+=G(g,{s:kk,cx:n.x,cy:300});
    if(i<2) ir+=T(n.x+90,315,'+',{size:46,weight:800,fill:'#7FA6C0',anchor:'middle',op:kk});
  });
  s+=ir;
  s+=G(T(960,480,'KI + MCP + Revit',{size:104,weight:800,fill:'#fff',anchor:'middle',ls:-2.5}),{op:a,y:(1-a)*24});
  s+=G(T(960,560,'Regelwerk inklusive, Zeit gespart.',{size:46,weight:600,fill:C.rGreen2,anchor:'middle'}),{op:b,y:(1-b)*20});
  // Logo-Platzhalter
  s+=G(R(780,650,360,130,'none',{rx:22,stroke:'#5A7C96',sw:2.5,dash:'10 8'})+T(960,726,'Ihr Logo',{size:30,weight:700,fill:'#8FB0C7',anchor:'middle'})+T(960,840,'Name · Unternehmen',{size:28,weight:600,fill:'#B6CCDA',anchor:'middle'}),{op:c,y:(1-c)*16});
  return G(s,{op:k>0?1:0});
}

/* ---------- Komposition ---------- */
const DEFS=`<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0C2A40" flood-opacity="0.12"/></filter>
  <linearGradient id="outro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E30"/><stop offset="0.6" stop-color="#0E2C44"/><stop offset="1" stop-color="#0D3B45"/></linearGradient>
  <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.lBg}"/><stop offset="1" stop-color="#E7E1DF"/></linearGradient>
  <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.rBg}"/><stop offset="1" stop-color="#DCEEF5"/></linearGradient>
</defs>`;

function renderFrame(t){
  t=clamp(t,0,DUR);
  let s=DEFS;
  // Hintergrund (Split)
  s+=R(0,0,960,1080,'url(#lbg)')+R(960,0,960,1080,'url(#rbg)');
  const split=E(t,2.9,3.6);
  const mainOut=E(t,13.9,14.4);
  // Mittellinie
  s+=L(960,0,960,1080,'#FFFFFF',4,{op:0.9});
  // Hauptszene
  if(t>=2.9 && t<14.6){
    const op=split*(1-mainOut);
    const sc=lerp(1.02,1,split)*lerp(1,0.97,mainOut);
    s+=G(G(header('l',t)+sceneLeft(t),{})+G(header('r',t)+G(sceneRight(t),{x:960}),{}),{op,s:sc,cx:960,cy:540});
    s+=G(Ci(960,80,30,C.navy)+T(960,91,'vs.',{size:24,weight:800,fill:'#fff',anchor:'middle'}),{op});
  }
  if(t<3.3) s+=sceneTitle(t);
  if(t>=14) s+=sceneCompare(t);
  if(t>=17.8) s+=sceneOutro(t);
  document.getElementById('stage').innerHTML=s;
  const tc=document.getElementById('tc'); if(tc) tc.textContent=t.toFixed(2)+' s';
}
window.renderFrame=renderFrame; window.DUR=DUR; window.FPS=FPS;

/* ---------- Vorschau-Player ---------- */
const qs=new URLSearchParams(location.search);
if(qs.has('capture')){document.body.classList.add('capture');renderFrame(+qs.get('t')||0);}
else{
  document.body.classList.add('preview');
  let t0=performance.now(), playing=true, cur=+qs.get('t')||0;
  const loop=now=>{ if(playing){cur=(cur+(now-t0)/1000)%DUR;} t0=now; renderFrame(cur); requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
  addEventListener('keydown',e=>{if(e.code==='Space'){playing=!playing;e.preventDefault();}if(e.code==='ArrowRight')cur=Math.min(DUR,cur+1);if(e.code==='ArrowLeft')cur=Math.max(0,cur-1);});
}
